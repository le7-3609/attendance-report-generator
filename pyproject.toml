[project]
name = "attendance-generator"
version = "0.1.0"
description = "Attendance report variation generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pypdfium2>=4.0",
    "pytesseract>=0.3.13",
    "Pillow>=10.0",
    "reportlab>=4.1",
    "python-bidi>=0.4",
    "jinja2>=3.1",
    "gradio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
